id: incident-nsa-ant-cottonmouth
title: "NSA ANT catalog COTTONMOUTH: USB hardware implant with RF exfiltration"
entry_type: documented-incident
cve: null
date: "2013-12"

affected_product: USB connector/plug hardware implants (COTTONMOUTH-I/II/III)
manufacturer: documented in leaked NSA ANT catalog
platform: [hardware]
transport: [usb, proprietary-rf]
protocol: [usb-hid]

attack_class: [HID-08, HID-11]
attack_direction: [DEVICE_TO_HOST, DEVICE_TO_NETWORK]
attack_vector: supply-chain/physical
prerequisites: >
  Ability to implant hardware into a USB connector/device (interdiction or physical access).
authentication_required: physical
user_interaction: none
firmware_involved: true
host_component: Target computer via USB; covert RF link for C2/exfil
network_component: true

impact: >
  A USB hardware implant provides a covert bridge into the target and an RF channel for command-and-control and exfiltration that bypasses host network monitoring.
severity:
  cvss_version: null
  base_score: null
  base_severity: null
  vector: ""
cwe: [CWE-1357]

technical_summary: >
  Documents in the leaked NSA ANT catalog (published by Der Spiegel/Jacob Appelbaum, Dec 2013) describe COTTONMOUTH, a family of USB hardware implants concealed in connectors/plugs that provide covert access and an integrated short-range RF transceiver for out-of-band command-and-control and data exfiltration. It is the canonical DEVICE->NETWORK + supply-chain-implant example: it shows nation-state-grade HID/USB implants with independent radios are real, and that host-only network monitoring cannot see their exfiltration channel.

detection: >
  Not host-observable via software; requires physical inspection / RF monitoring / X-ray. Motivates hardware-side HID firewall observation.
mitigation: >
  Supply-chain assurance, tamper-evident hardware, RF-shielded environments, physical inspection of peripherals in high-assurance settings.

