cwe: [CWE-287, CWE-310]

technical_summary: >
  Bastille Research (Marc Newlin, 2016) disclosed MouseJack: a class of vulnerabilities in proprietary 2.4GHz (typically Nordic nRF24-based) wireless mouse/keyboard dongles from many vendors. Because keystroke frames were often unencrypted or unauthenticated, an attacker with a cheap radio could inject keystrokes into the host, or force-pair a spoofed keyboard, from tens of meters away. KeyJack extended this to keyboards specifically. This is distinct from Bluetooth and shows a whole separate wireless-HID transport with weaker security than Bluetooth; several vendor CVEs followed (see CVE-2016-6257).

detection: >
  Prefer wired or authenticated Bluetooth input; RF monitoring; vendor dongle firmware updates.
mitigation: >
  Firmware updates from affected vendors; replace non-updatable dongles; avoid proprietary 2.4GHz HID in sensitive settings.

