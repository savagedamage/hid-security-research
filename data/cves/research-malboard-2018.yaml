technical_summary: >
  Malboard (Farhi, Nissim, Elovici; Computers & Security, 2019) demonstrated a compromised keyboard that generates keystrokes imitating a targeted user's typing behavior, evading three keystroke-dynamics-based intrusion detectors. It is important for this project because it shows that 'detect injection by typing rhythm' is not a complete defense: a sufficiently capable malicious device can also forge the rhythm. Defenses must therefore combine multiple signals (enumeration behavior, timing relative to attach, out-of-band physical key sensing) rather than rely on rhythm alone.

detection: >
  Do not rely solely on keystroke-dynamics; combine with device-provenance and enumeration-timing signals.
mitigation: >
  Multi-signal detection; hardware root-of-trust on the keyboard side.

