technical_summary: >
  USBGuard is an open-source framework that implements USB device authorization policy on Linux using the kernel's per-device 'authorized' flag. Policies can allow-list known devices and block new ones -- including blocking devices that expose unexpected HID/keyboard interfaces. It is a key defensive reference for this project: it addresses HID-01/HID-02 at the authorization layer, but is limited by VID/PID spoofability and cannot inspect report/descriptor content or behavior, which is where hidwatch and a HID firewall add value.

detection: >
  n/a (it is an enforcement/authorization control, complementary to behavioral detection).
mitigation: >
  Deploy USBGuard with a curated allow-list; combine with behavioral monitoring.

