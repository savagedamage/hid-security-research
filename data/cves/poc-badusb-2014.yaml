id: poc-badusb-2014
title: "BadUSB: reprogramming USB device firmware to impersonate a keyboard"
entry_type: proof-of-concept
cve: null
date: "2014-08"

affected_product: Generic reprogrammable USB controllers (e.g. certain Phison mass-storage MCUs)
manufacturer: n/a (research)
platform: [cross-platform]
transport: [usb]
protocol: [usb-hid, hid]

attack_class: [HID-01, HID-02, HID-03, HID-05]
attack_direction: [DEVICE_TO_HOST]
attack_vector: physical
prerequisites: >
  Ability to reflash a USB device's controller firmware (often unsigned) and physical access to a target port.
authentication_required: physical
user_interaction: none
firmware_involved: true
host_component: Any USB host that trusts device-declared class/descriptors
network_component: false

impact: >
  A device that looks like an ordinary USB stick can silently add a HID keyboard interface and inject keystrokes, or emulate other classes -- with no host software vulnerability required.
severity:
  cvss_version: null
  base_score: null
  base_severity: null
  vector: ""
cwe: [CWE-1326]

technical_summary: >
  Karsten Nohl and Jakob Lell (SR Labs) demonstrated at Black Hat USA 2014 that many USB devices have reflashable, unsigned controller firmware. By rewriting that firmware, a benign-looking device can register additional USB interfaces -- notably a HID keyboard -- and inject arbitrary keystrokes, spoof a network adapter, or emulate other device classes. Because the host trusts the device's self-description, no OS vulnerability is needed; this is abuse of the USB trust model itself, which is why it cannot be fully 'patched' and motivates policy/behavioral defenses.

detection: >
  Behavioral monitoring: a mass-storage device that re-enumerates adding a HID interface, or a new keyboard appearing then immediately typing, is anomalous. Device authorization allow-lists (imperfect due to VID/PID spoofing).
mitigation: >
  USB device authorization (USBGuard, Windows device-installation restrictions), disabling unused ports, signed device firmware (rare), and HID firewall enforcement.

